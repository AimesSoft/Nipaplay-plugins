name: Validate plugin

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**/*.js'
      - 'scripts/sync_plugins_index.py'
      - '.github/workflows/validate-plugin.yml'

jobs:
  validate:
    if: github.repository == 'AimesSoft/Nipaplay-plugins'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore main plugins.json for ID uniqueness check
        run: git show origin/main:plugins.json > plugins.json 2>/dev/null || true

      - name: Validate all plugin manifests
        run: python scripts/sync_plugins_index.py --validate --scan
